<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mapa del cielo en tiempo real para visitantes de observatorios del Limarí y la Región de Coquimbo.">
<title>Cielos de Ovalle — Mapa del cielo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2302070b'/%3E%3Cpath d='M32 10v44M10 32h44' stroke='%2346f0be' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='32' cy='18' r='4' fill='%23ffc861'/%3E%3Ccircle cx='32' cy='48' r='5' fill='%23cfe0ff'/%3E%3Ccircle cx='20' cy='30' r='4' fill='%23cfe0ff'/%3E%3Ccircle cx='45' cy='33' r='4' fill='%23cfe0ff'/%3E%3C/svg%3E">
<!-- Fuentes opcionales: si no hay conexión, se usan las del sistema -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#02070b; --panel:rgba(5,15,20,.88); --panel2:rgba(10,26,32,.92);
  --line:rgba(70,240,190,.22); --line2:rgba(70,240,190,.45);
  --teal:#46f0be; --amber:#ffc861; --ink:#e8f2f4; --mute:#8ea7ad; --rose:#ff7a8a;
  --ui:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
body.ar #cam{display:block}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#view.swap{animation:swap .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
#view:active{cursor:grabbing}

/* Barra superior */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--st)) 12px 8px;background:linear-gradient(#02070bee 55%,#02070b00);pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font:700 12px/1.05 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.brand svg{width:30px;height:30px;stroke:var(--teal);stroke-width:1;fill:none;opacity:.95}
.brand svg circle{fill:#dbe7ff;stroke:none}.brand svg circle:first-of-type{fill:var(--amber)}
.seg{margin:0 auto;display:flex;position:relative;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px;backdrop-filter:blur(10px)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--teal);box-shadow:0 0 18px rgba(70,240,190,.35);transition:transform .38s cubic-bezier(.3,1.3,.4,1)}
body.cosmos .seg::before{transform:translateX(100%)}
.seg button{flex:1;position:relative;padding:7px 16px;border-radius:999px;font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:74px;transition:color .25s}
.seg button.on{color:#012018}
.tools{display:flex;gap:6px}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;backdrop-filter:blur(10px);color:var(--ink)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.txt{font:700 12px var(--display);letter-spacing:.06em}
.ic.on{background:var(--teal);color:#012018;border-color:var(--teal);box-shadow:0 0 16px rgba(70,240,190,.35)}
/* Respuesta al toque en todos los controles */
.ic,.btn,.side,.chip,.cta,#stops button{transition:transform .16s cubic-bezier(.3,1.4,.5,1),background-color .2s,border-color .2s,color .2s,box-shadow .25s,opacity .2s}
.ic:active,.btn:active,.side:active,.chip:active,#stops button:active{transform:scale(.93)}
.item{transition:background-color .2s,padding .2s}
@media (hover:hover){.ic:hover,.side:hover,.chip:hover,.btn:hover,#stops button:hover{border-color:var(--line2);box-shadow:0 0 0 1px rgba(70,240,190,.12),0 6px 22px rgba(0,0,0,.35)}
  .item:hover{background:rgba(70,240,190,.06);padding-left:10px}.cta:hover{transform:translateY(-2px)}}
#b-red.on{background:#ff3b30;border-color:#ff3b30;color:#200}

/* Chips de lugar y hora */
#chips{position:fixed;z-index:19;left:12px;right:12px;top:calc(62px + var(--st));display:flex;gap:8px;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(10px);font-size:13px;color:var(--ink);max-width:62%;white-space:nowrap;overflow:hidden}
.chip svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--teal);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chip span{overflow:hidden;text-overflow:ellipsis}.chip b{font-variant-numeric:tabular-nums}
.chip em{font:700 9px var(--display);letter-spacing:.12em;font-style:normal;color:var(--amber);border:1px solid rgba(255,200,97,.4);border-radius:4px;padding:1px 5px;flex:none}
.chip em.live{color:var(--teal);border-color:var(--line2)}
.chip em.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:4px;vertical-align:1px;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
#c-time{margin-left:auto}

#heading{position:fixed;z-index:18;left:50%;transform:translateX(-50%);top:calc(110px + var(--st));text-align:center;pointer-events:none;
  font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--teal);text-shadow:0 1px 6px #000}
#heading small{display:block;font:400 11px var(--ui);letter-spacing:.02em;text-transform:none;color:var(--mute);margin-top:2px}

#banner{position:fixed;z-index:21;left:12px;right:12px;top:calc(140px + var(--st));max-width:520px;margin:0 auto;display:none;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;border:1px solid rgba(255,200,97,.45);background:var(--panel2);backdrop-filter:blur(12px);font-size:13px}
#banner.show{display:flex;animation:drop .45s cubic-bezier(.2,.9,.25,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
#banner span{flex:1}#banner .x{font-size:22px;line-height:1;color:var(--mute);padding:0 4px}

/* Riel lateral */
#rail{position:fixed;z-index:21;right:12px;bottom:calc(120px + var(--sb));display:flex;flex-direction:column;gap:8px;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1),right .32s cubic-bezier(.2,.9,.25,1),bottom .32s cubic-bezier(.2,.9,.25,1)}
#rail .ic{width:44px;height:44px}
body.cosmos #b-sensor,body.cosmos #b-cam{display:none!important}

/* Barra inferior */
#dock{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:26px 12px calc(12px + var(--sb));background:linear-gradient(#02070b00,#02070bf2 60%);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1),padding .32s cubic-bezier(.2,.9,.25,1)}
#dock>div{pointer-events:auto;max-width:560px;margin:0 auto}
.sky-dock{display:flex;align-items:stretch;gap:8px}
.cosmos-dock{display:none}body.cosmos .cosmos-dock{display:block}body.cosmos .sky-dock{display:none}
.side{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(10px);font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.side svg{width:22px;height:22px;fill:none;stroke:var(--teal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cta{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:10px 14px;border-radius:18px;background:var(--amber);color:#1c1200;
  font:700 15px var(--display);letter-spacing:.02em;box-shadow:0 0 0 1px #ffe1a0 inset,0 10px 34px rgba(255,200,97,.28)}
.cta svg{width:24px;height:24px;flex:none;fill:none;stroke:#1c1200;stroke-width:1.9;stroke-linecap:round}
.cta{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px #ffe1a0 inset,0 10px 34px rgba(255,200,97,.22)}50%{box-shadow:0 0 0 1px #ffe1a0 inset,0 10px 44px rgba(255,200,97,.5)}}
.cta:active{transform:scale(.97)}
#stops{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
#stops::-webkit-scrollbar{display:none}
#stops button{flex:none;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 12px var(--display);letter-spacing:.04em;color:var(--mute);backdrop-filter:blur(10px)}
#stops button.on{background:var(--teal);border-color:var(--teal);color:#012018}

/* Hoja */
#sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:62vh;display:flex;flex-direction:column;background:var(--panel2);
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;backdrop-filter:blur(18px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  padding-bottom:var(--sb);box-shadow:0 -20px 60px rgba(0,0,0,.55)}
#sheet.open{transform:none}#sheet.tall{max-height:82vh}
.grip{position:relative;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:8px auto 0;touch-action:none}
.grip::before{content:"";position:absolute;inset:-10px -90px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 18px;touch-action:none}
/* El contenido de una ficha nueva entra en cascada */
#sheet-body.fresh>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#sheet-body.fresh>:nth-child(2){animation-delay:.04s}#sheet-body.fresh>:nth-child(3){animation-delay:.08s}#sheet-body.fresh>:nth-child(4){animation-delay:.12s}
#sheet-body.fresh>:nth-child(5){animation-delay:.16s}#sheet-body.fresh>:nth-child(6){animation-delay:.2s}#sheet-body.fresh>:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet-head h2{flex:1;font:700 21px/1.15 var(--display);letter-spacing:.01em}
#sheet-close{font-size:24px;line-height:1;width:38px;height:38px;border-radius:50%}
#sheet-body{overflow-y:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
body.sheet-open #dock,body.sheet-open #rail{opacity:0;pointer-events:none;transform:translateY(14px)}
body.sheet-open #dock>div{pointer-events:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--teal)}
.tag.tool{color:var(--amber);border-color:rgba(255,200,97,.45)}
.sub{color:var(--mute);font-size:13px;margin:-2px 0 8px}
.now{font-weight:700;color:var(--teal);margin-bottom:8px}
.lead{font-size:16px;line-height:1.5;margin-bottom:12px}
.light{font-style:italic;color:#cfe0ff;margin:10px 0}
.warn{border:1px solid var(--rose);color:#ffd0d5;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:14px}
.grid{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:10px 0;background:rgba(0,0,0,.2)}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid rgba(70,240,190,.1);font-size:14px}
.row:last-child{border-bottom:0}.row span{color:var(--mute)}.row b{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.blk{margin:12px 0}.blk h4{font:700 10px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.blk.fact{border-left:3px solid var(--amber);padding-left:10px}.blk.fact h4{color:var(--amber)}
.blk.cult{border-left:3px solid var(--teal);padding-left:10px}
details{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:0 12px}
summary{padding:10px 0;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.acts{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(70,240,190,.07);font:600 13px var(--display);letter-spacing:.04em;color:var(--ink)}
.btn.gold{background:var(--amber);border-color:var(--amber);color:#1c1200}
.btn.on{background:var(--teal);border-color:var(--teal);color:#012018}
.btn.wide{width:100%;margin:6px 0}
h3{font:700 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:18px 0 6px}
.item{width:100%;display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 4px;border-bottom:1px solid rgba(70,240,190,.1);text-align:left}
.item .nm{flex:1;font-weight:700}.item small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.item .rt{font:600 12px var(--display);color:var(--teal);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.off .nm,.item.off .rt{color:var(--mute)}.item.on .nm{color:var(--amber)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#cfe0ff}
.dot.k-body{background:var(--amber)}.dot.k-dso{background:#ff9ac0;border-radius:3px}.dot.k-con{background:none;border:1.5px solid #7eb2ff}.dot.k-site{background:var(--teal)}
.search,.dt,.two input{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--ink);font:16px var(--ui);color-scheme:dark}
.dt{margin:8px 0}.two{display:flex;gap:8px;margin-bottom:4px}.two label{flex:1;font-size:12px;color:var(--mute)}
.steps,.rates{display:flex;gap:6px;flex-wrap:wrap}.steps .btn{flex:1}
.mute{color:var(--mute);font-size:13px;margin-top:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid rgba(70,240,190,.1);cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{flex:none;width:46px;height:26px;border-radius:26px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--teal)}.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--amber);outline-offset:2px}
.slider{padding:12px 0;border-bottom:1px solid rgba(70,240,190,.1)}.slider>div{display:flex;align-items:center;gap:10px;margin-top:6px}
.slider small{color:var(--mute)}input[type=range]{flex:1;accent-color:var(--teal);height:28px}

#toast{position:fixed;z-index:60;left:50%;bottom:calc(112px + var(--sb));transform:translate(-50%,16px);max-width:min(92vw,460px);padding:11px 16px;border-radius:14px;
  background:#0c2026;border:1px solid var(--line2);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s cubic-bezier(.3,1.5,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#welcome{position:fixed;z-index:70;inset:0;display:grid;place-items:center;padding:20px;background:rgba(1,5,8,.72);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#welcome.show{opacity:1;visibility:visible;transition:opacity .35s}
#welcome .card{width:min(420px,100%);padding:26px 22px 18px;border-radius:24px;border:1px solid var(--line2);background:linear-gradient(160deg,#0a2028,#04101a);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(70,240,190,.08);transform:translateY(22px) scale(.96);transition:transform .6s cubic-bezier(.2,.9,.25,1)}
#welcome.show .card{transform:none}
#welcome.show .card>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#welcome.show .card>:nth-child(2){animation-delay:.08s}#welcome.show .card>:nth-child(3){animation-delay:.14s}#welcome.show .card>:nth-child(4){animation-delay:.2s}#welcome.show .card>:nth-child(n+5){animation-delay:.28s}
#welcome .kick{font:600 11px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
#welcome h1{font:700 40px/1 var(--display);margin:8px 0 10px;letter-spacing:-.01em}
#welcome ul{list-style:none;margin:14px 0 16px}
#welcome li{padding:8px 0 8px 22px;position:relative;border-top:1px solid rgba(70,240,190,.12)}
#welcome li::before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--amber)}

/* Luz roja: conserva la adaptación a la oscuridad */
#redveil{position:fixed;inset:0;z-index:90;pointer-events:none;background:#ff1a00;mix-blend-mode:multiply;display:none}
body.red #redveil{display:block}

@media (min-width:860px){
  #sheet{left:auto;right:16px;bottom:16px;top:76px;width:392px;max-height:none!important;border-radius:22px;border:1px solid var(--line);transform:translateX(112%)}
  #sheet.open{transform:none}.grip{display:none}
  body.sheet-open #dock,body.sheet-open #rail{opacity:1;pointer-events:auto;transform:none}
  body.sheet-open #dock>div{pointer-events:auto}
  body.sheet-open #dock{padding-right:424px}
  body.cosmos #dock>div{max-width:1120px}
  #stops{justify-content:safe center}
  #rail{right:16px;bottom:100px}body.sheet-open #rail{right:424px}
  #chips{left:16px;right:auto;top:76px;flex-direction:column;align-items:flex-start}.chip{max-width:none}#c-time{margin-left:0}
  #heading{top:22px;left:50%;margin-top:52px}
  .brand{font-size:13px}
}
@media (max-width:420px){.brand span{display:none}.seg button{min-width:64px;padding:7px 12px}}
@media (max-height:520px){#heading{display:none}#sheet{max-height:80vh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="view" aria-label="Mapa del cielo"></canvas>

<header id="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v26M3 16h26" /><circle cx="16" cy="8" r="2.2"/><circle cx="16" cy="25" r="2.8"/><circle cx="9.5" cy="15" r="2.2"/><circle cx="23" cy="16.5" r="2.2"/></svg><span>Cielos<br>de Ovalle</span></div>
  <nav class="seg" aria-label="Modo"><button id="m-sky" class="on"></button><button id="m-cosmos"></button></nav>
  <div class="tools"><button id="b-red" class="ic"></button><button id="b-lang" class="ic txt">EN</button><button id="b-help" class="ic txt">?</button></div>
</header>
<div id="chips"><button id="c-place" class="chip"></button><button id="c-time" class="chip"></button></div>
<div id="heading" aria-live="off"></div>
<div id="banner" role="status"></div>

<div id="rail">
  <button id="b-sensor" class="ic"></button>
  <button id="b-cam" class="ic"></button>
  <button id="b-in" class="ic"></button>
  <button id="b-out" class="ic"></button>
</div>

<footer id="dock">
  <div class="sky-dock">
    <button id="b-tonight" class="side"></button>
    <button id="b-what" class="cta"></button>
    <button id="b-layers" class="side"></button>
  </div>
  <div class="cosmos-dock"><div id="stops"></div></div>
</footer>

<section id="sheet" aria-live="polite">
  <div class="grip"></div>
  <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="ic">×</button></div>
  <div id="sheet-body"></div>
</section>
<div id="toast" role="status"></div>
<div id="welcome"></div>
<div id="redveil" aria-hidden="true"></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script>
/* ---- astro.js ---- */
/* =====================================================================
   astro.js — Motor astronómico de Cielos de Ovalle
   Sin dependencias. Funciona igual en el navegador y en Node (tests).

  stars: {

    hadar: { dist: '390', d: { es: 'Beta Centauri, una gigante azul. Junto a Alfa Centauri forma «los Punteros».', en: 'Beta Centauri, a blue giant. With Alpha Centauri it forms "the Pointers".' }, f: { es: 'Parece vecina de Alfa Centauri, pero está casi 90 veces más lejos.', en: 'It looks like Alpha Centauri\'s neighbor but is almost 90 times farther away.' } },
    acrux: { dist: '320', d: { es: 'La estrella más brillante de la Cruz del Sur, al pie de la cruz. Con telescopio se separa en dos estrellas azules.', en: 'The brightest star of the Southern Cross, at the foot of the cross. A telescope splits it into two blue stars.' }, f: { es: 'El palo largo de la cruz, prolongado unas 4,5 veces, señala el polo sur celeste.', en: 'The long bar of the cross, extended about 4.5 times, points to the south celestial pole.' }, cult: { es: 'La Cruz del Sur es la Chakana andina; para el pueblo mapuche, la huella del choique (ñandú).', en: 'The Southern Cross is the Andean Chakana; for the Mapuche, the footprint of the choique (rhea).' } },

    regulus: { dist: '79', d: { es: 'El corazón del León. Está casi sobre la eclíptica, así que la Luna y los planetas pasan muy cerca de ella.', en: 'The heart of the Lion. It lies almost on the ecliptic, so the Moon and planets pass close by.' }, f: { es: 'Gira tan rápido que, un poco más y se desarmaría.', en: 'It spins so fast that a little faster and it would fly apart.' } }

/* =====================================================================
   sky.js — Renderizador del cielo (Canvas 2D)
   Cámara = base ortonormal {R, U, F} en coordenadas [Este, Norte, Arriba].
   · Modo manual / brújula: proyección estereográfica (los círculos de la
     esfera siguen siendo círculos: el horizonte se rellena de forma exacta).

        S.view.alt = A.clamp(S.view.alt + d0.alt - d1.alt, -8, 90);

      var kk = Math.exp(-dt * 3.4); glide.az *= kk; glide.alt *= kk;

  /* ---------- «Esta noche» ---------- */
  function nightInfo() {
    var alt = A.altOf('sun', S.site), j = jd(), sunUp = alt(j) > A.H0.sun;
    var from = sunUp ? j : j - 0.75;
    var c = A.crossings(alt, from, 1.6, A.H0.sun, 8), set, rise, i;
    for (i = 0; i < c.length; i++) {
      if (!c[i].rising) { if (sunUp ? !set : c[i].jd <= j) set = c[i].jd; }
    }
    if (!set) return { set: null };
    for (i = 0; i < c.length; i++) if (c[i].rising && c[i].jd > set) { rise = c[i].jd; break; }
    var a = A.crossings(alt, set, rise ? rise - set : 0.9, A.H0.astro, 6), dusk, dawn;
    a.forEach(function (x) { if (!x.rising && !dusk) dusk = x.jd; if (x.rising && dusk) dawn = x.jd; });
    return { set: set, rise: rise, dusk: dusk, dawn: dawn };
  }
  function duskTime() {
    var alt = A.altOf('sun', S.site), j = jd();
    if (alt(j) < -12) return null;
    var c = A.crossings(alt, j, 1.1, A.H0.nautical, 6).filter(function (x) { return !x.rising; });
    return c.length ? A.msFromJd(c[0].jd) : null;
  }
  function searchIndex() {

  function plain(s) { return (s || '').toLowerCase().normalize ? (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') : (s || '').toLowerCase(); }

  function openTime() {
    var p = parts(S.t), html = '';
    html += '<div class="acts"><button class="btn gold" data-act="now">' + esc(T('now')) + '</button>' + (duskTime() ? '<button class="btn" data-act="dusk">' + esc(T('dusk')) + '</button>' : '') + '</div>';
    html += '<input id="i-dt" class="dt" type="datetime-local" value="' + p.y + '-' + p2(p.m) + '-' + p2(p.d) + 'T' + p2(p.H) + ':' + p2(p.M) + '">';
    html += '<div class="steps">' + [['-1d', -86400], ['-1h', -3600], ['+1h', 3600], ['+1d', 86400]].map(function (s) {
      return '<button class="btn" data-act="shift" data-id="' + s[1] + '">' + s[0].replace('d', ' ' + T('day')).replace('h', ' ' + T('hour')) + '</button>';
    }).join('') + '</div>';
    html += '<h3>' + esc(T('speed')) + '</h3><div class="rates">' + RATES.map(function (r) {
      return '<button class="btn' + (S.rate === r ? ' on' : '') + '" data-act="rate" data-id="' + r + '">' + esc(rateLabel(r)) + '</button>';
    }).join('') + '</div>';
    openSheet('time', T('time'), html);
  }
  function openHelp() {
    var html = '';
    T('helpBody').forEach(function (h) { html += '<div class="blk"><h4>' + esc(h[0]) + '</h4><p>' + esc(h[1]) + '</p></div>'; });
    html += '<p class="mute">' + esc(T('precision')) + '<br>' + esc(T('about')) + '</p>';
    openSheet('help', T('help'), html, true);
  }
  function setTime(ms, live) { S.t = ms; S.live = !!live; if (live) S.rate = 1; refreshChips(true); }
  function setSite(name, lat, lon) {
    S.site = { name: name, lat: A.clamp(lat, -89.9, 89.9), lon: A.norm180(lon) };
    store.save(); refreshChips(true); banner.dismissed = false;
  }

  /* ---------- «¿Qué estoy mirando?» ---------- */
  function identify() {
    if (S.sensor && S.sel && Sky.guide) { toast(fmt(T('guide'), Sky.guide)); }
    var hit = Sky.pick(W / 2, H / 2, Math.min(W, H) * 0.09);
    if (hit) { select(hit, false); return; }
    var F = S.cam.F, h = A.azAltFromEnu(F), con = Sky.nearestConstellation(F), best = null, bd = 999, L = S.lang;
    function consider(sel, name) { var v = Sky.dirOf(sel); if (!v || v[2] < 0.05) return; var d = A.angSep(v, F); if (d < bd) { bd = d; best = { sel: sel, name: name }; } }
    Object.keys(CONTENT.bodies).forEach(function (id) { if (id !== 'uranus' && id !== 'neptune') consider({ kind: 'body', id: id }, CONTENT.bodies[id].name[L]); });
    Sky.dsos.forEach(function (o, i) { if (o.d.prio >= 7) consider({ kind: 'dso', id: i }, o.d.name[L]); });
    for (var i = 0; i < Sky.N && Sky.smag[i] < 1.6; i++) consider({ kind: 'star', id: i }, Sky.starName(i, L));
    var html = '<p class="lead">' + esc(fmt(T('nothingBody'), T('dirs')[dir8(h.az)], Math.round(Math.max(0, h.alt)), con ? con[L] : '—')) + '</p>';
    if (best) {
      html += '<p class="lead">' + esc(fmt(T('nearest'), best.name, Math.round(bd))) + '</p>' +
        '<div class="acts"><button class="btn gold" data-act="pick" data-fly="1" data-kind="' + best.sel.kind + '" data-id="' + best.sel.id + '">' + esc(T('goto')) + ' → ' + esc(best.name) + '</button></div>';
    }
    html += '<p class="mute">' + esc(T('tryTap')) + '</p>';
    openSheet('none', T('nothing'), html);
  }

  /* ---------- Controles fijos ---------- */
  var ICON = {
    compass: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
    cam: '<svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>', minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M19 14.5A8 8 0 019.5 5a8 8 0 109.5 9.5z"/></svg>',
    scope: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>',
    list: '<svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.4 5.8.5-4.4 3.8 1.4 5.7-5-3.1-5 3.1 1.4-5.7L4 8.9l5.8-.5z"/></svg>',
    layers: '<svg viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 10-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
  };
  function refreshRail() {
    $('b-sensor').classList.toggle('on', S.sensor); $('b-cam').classList.toggle('on', S.camera);
    $('b-cam').style.display = S.sensor ? '' : 'none';
    document.body.classList.toggle('sensing', S.sensor);
  }
  var chipState = '';
  function refreshChips(force) {
    var st = S.rate === 0 ? T('paused') : (S.live ? T('live') : (S.rate === 1 ? T('sim') : '× ' + rateLabel(S.rate)));
    var key = S.site.name + '|' + Math.floor(S.t / 60000) + '|' + st + '|' + S.lang;
    if (!force && key === chipState) return; chipState = key;
    $('c-place').innerHTML = ICON.pin + '<span>' + esc(S.site.name) + '</span>';
    $('c-time').innerHTML = ICON.clock + '<span>' + esc(dateLabel(S.t)) + ' · <b>' + hhmm(S.t) + '</b></span><em class="' + (S.live && S.rate === 1 ? 'live' : '') + '">' + esc(st) + '</em>';
  }
  function refreshStops() {
    var cur = Cosmos.stopFor(Cosmos.view.goal);
    Array.prototype.forEach.call($('stops').children, function (b, i) { b.classList.toggle('on', i === cur); });
  }
  function applyLang() {
    document.documentElement.lang = S.lang;
    $('b-lang').textContent = S.lang === 'es' ? 'EN' : 'ES';
    $('m-sky').textContent = T('sky'); $('m-cosmos').textContent = T('cosmos');
    $('b-what').querySelector('span').textContent = T('what');
    $('b-tonight').querySelector('span').textContent = T('tonight');
    $('b-layers').querySelector('span').textContent = T('layers');
    [['b-sensor', 'sensor'], ['b-cam', 'camera'], ['b-in', 'zoomIn'], ['b-out', 'zoomOut'], ['b-red', 'night'], ['b-help', 'help'], ['sheet-close', 'close']].forEach(function (p) {
      $(p[0]).setAttribute('aria-label', T(p[1])); $(p[0]).title = T(p[1]);
    });
    $('stops').innerHTML = Cosmos.STOPS.map(function (s, i) { return '<button data-act="stop" data-id="' + i + '">' + esc(T('stops')[s.id]) + '</button>'; }).join('');
    refreshStops(); refreshChips(true); heading.key = '';
    if (sheetKind === 'card' && S.sel && S.mode === 'sky') openCard(S.sel); else if (sheetKind) closeSheet();
  }
  function setMode(m) {
    var changed = m !== S.mode;
    S.mode = m; if (m === 'cosmos' && S.sensor) stopSensor();
    if (changed) {
      Sky.hover = null; glide = null; cv.style.cursor = '';
      cv.classList.remove('swap'); void cv.offsetWidth; cv.classList.add('swap');
      if (!REDUCE) {
        if (m === 'cosmos') { Cosmos.view.span = Cosmos.view.goal * 2.6; spin.yaw = 0.5; }
        else { var f0 = goalFov(); S.view.fov = Math.min(130, f0 * 1.18); startAnim(S.view.az, S.view.alt, f0, 0, 700, true); }
      }
    }
    document.body.classList.toggle('cosmos', m === 'cosmos');
    $('m-sky').classList.toggle('on', m === 'sky'); $('m-cosmos').classList.toggle('on', m === 'cosmos');
    closeSheet(); banner.el.classList.remove('show');
    if (m === 'cosmos' && S.rate < 86400 && S.rate !== 0) { /* el reloj real basta: los planetas se mueven despacio */ }
    if (m === 'sky' && S.rate > 3600) { S.rate = 1; refreshChips(true); }
  }

  var heading = { key: '' };
  function refreshHeading() {
    var h = A.azAltFromEnu(S.cam.F), txt, key;
    if (S.mode === 'cosmos') {
      var span = Cosmos.view.span; key = 'c' + Math.round(Math.log(span) * 20) + S.lang;
      if (key === heading.key) return; heading.key = key;
      $('heading').innerHTML = '<b>' + esc(fmt(T('viewWidth'), Cosmos.fmtDist(span, S.lang))) + '</b><small>' + esc(fmt(T('lightCross'), lightSpan(span))) + '</small>';
      return;
    }
    key = dir8(h.az) + '|' + Math.round(h.alt) + S.lang;
    if (key === heading.key) return; heading.key = key;
    txt = h.alt > 84 ? T('zenith') : fmt(T('lookingAt'), T('dirsShort')[dir8(h.az)], Math.round(h.alt));
    $('heading').innerHTML = '<b>' + esc(txt) + '</b>';
  }
  function lightSpan(au) {
    var ly = au / A.LY_AU;
    if (ly >= 1) return (ly >= 100 ? Math.round(ly).toLocaleString(S.lang === 'es' ? 'es-CL' : 'en-US') : num(ly, 1)) + ' ' + T('ya');
    var s = au * 499.004784;
    if (s > 86400 * 2) return Math.round(s / 86400) + ' ' + T('days');
    return lightTime(au);
  }
  var banner = { el: $('banner'), dismissed: false };
  function refreshBanner() {
    var show = S.mode === 'sky' && !banner.dismissed && S.layers.atm && Sky.sunAlt > -4 && !sheetKind && !$('welcome').classList.contains('show');
    if (show && !banner.el.classList.contains('show')) {
      banner.el.innerHTML = '<span>' + esc(fmt(T('daytime'), S.site.name)) + '</span><button class="btn gold" data-act="dusk">' + esc(T('dusk')) + '</button><button class="x" data-act="nobanner" aria-label="' + esc(T('close')) + '">×</button>';
    }
    banner.el.classList.toggle('show', show);
  }

  /* ---------- Delegación de eventos ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'pick') {
      var kind = el.getAttribute('data-kind'), sel = { kind: kind, id: kind === 'body' ? id : +id };
      if (S.mode !== 'sky') setMode('sky');
      Sky.update(S); select(sel, true);
    } else if (act === 'goto') { if (S.sel) { flyTo(S.sel); if (W < 860) closeSheetKeepSel(); if (S.sensor) toast(fmt(T('guide'), Math.round(A.angSep(Sky.dirOf(S.sel), S.cam.F)))); } }
    else if (act === 'cosmos') { setMode('cosmos'); var ix = { mercury: 0, venus: 0, mars: 0, sun: 0 }[id] === 0 ? 0 : 1; setSpan(Cosmos.STOPS[ix].span); }
    else if (act === 'sky') { setMode('sky'); Sky.update(S); select({ kind: 'body', id: id }, true); }
    else if (act === 'dusk') { var d = duskTime(); if (d) { setTime(d + 20 * 60000, false); S.rate = 1; banner.dismissed = true; closeSheet(); } }
    else if (act === 'nobanner') { banner.dismissed = true; }
    else if (act === 'now') { setTime(Date.now(), true); openTime(); }
    else if (act === 'shift') { setTime(S.t + (+id) * 1000, false); openTime(); }
    else if (act === 'rate') { S.rate = +id; S.live = S.live && S.rate === 1; refreshChips(true); openTime(); }
    else if (act === 'site') { var s = CONTENT.sites[+id]; setSite(s.name, s.lat, s.lon); openPlace(); }
    else if (act === 'coords') { var la = parseFloat($('i-lat').value), lo = parseFloat($('i-lon').value); if (isFinite(la) && isFinite(lo)) { setSite(T('custom'), la, lo); closeSheet(); } }
    else if (act === 'gps') {
      if (!navigator.geolocation) { toast(T('gpsFail')); return; }
      navigator.geolocation.getCurrentPosition(function (p) { setSite(T('myLocation'), p.coords.latitude, p.coords.longitude); toast(T('gpsOk')); closeSheet(); },
        function () { toast(window.isSecureContext === false ? T('needHttps') : T('gpsFail'), 5000); }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
    }
    else if (act === 'stop') { setSpan(Cosmos.STOPS[+id].span); }
    else if (act === 'start') { $('welcome').classList.remove('show'); store.save(true); if (id === 'sensor') startSensor(); else intro(); }
  });
  function closeSheetKeepSel() { var s = S.sel; closeSheet(); S.sel = s; }
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-layer')) { S.layers[t.getAttribute('data-layer')] = t.checked; store.save(); }
    if (t.id === 'i-dt' && t.value) { var m = t.value.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/); if (m) setTime(fromWall(+m[1], +m[2], +m[3], +m[4], +m[5]), false); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'r-mag') { S.magLimit = +t.value; store.save(); }
    if (t.id === 'r-fov') { S.camFov = +t.value; $('v-fov').textContent = t.value + '°'; store.save(); }
    if (t.id === 'r-off') { S.azOffset = +t.value; $('v-off').textContent = t.value + '°'; store.save(); }
  });
  $('sheet-close').addEventListener('click', function () { closeSheet(); S.sel = null; });
  (function () {
    var sh = $('sheet'), drag = null;
    function down(e) {
      if (W >= 860 || (e.target.closest && e.target.closest('button'))) return;
      drag = { y: e.clientY, t: Date.now(), d: 0 }; sh.style.transition = 'none';
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
    }
    function move(e) { if (!drag) return; drag.d = Math.max(0, e.clientY - drag.y); sh.style.transform = 'translateY(' + drag.d + 'px)'; }
    function up() {
      if (!drag) return;
      var d = drag.d, fast = d / Math.max(1, Date.now() - drag.t) > 0.5;
      sh.style.transition = ''; sh.style.transform = ''; drag = null;
      if (d > 90 || (fast && d > 24)) { closeSheet(); S.sel = null; }
    }
    [sh.querySelector('.grip'), sh.querySelector('.sheet-head')].forEach(function (el) {
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  })();
  $('b-what').addEventListener('click', identify);
  $('b-tonight').addEventListener('click', openTonight);
  $('b-layers').addEventListener('click', openLayers);
  $('c-place').addEventListener('click', openPlace);
  $('c-time').addEventListener('click', openTime);
  $('b-help').addEventListener('click', openHelp);
  $('b-lang').addEventListener('click', function () { S.lang = S.lang === 'es' ? 'en' : 'es'; store.save(); applyLang(); });
  $('b-red').addEventListener('click', function () { S.red = !S.red; document.body.classList.toggle('red', S.red); $('b-red').classList.toggle('on', S.red); store.save(); });
  $('b-sensor').addEventListener('click', function () { if (S.sensor) { stopSensor(); toast(T('sensorOff')); } else startSensor(); });
  $('b-cam').addEventListener('click', function () { if (S.camera) stopCamera(); else startCamera(); });
  function zoom(f) {
    if (S.mode === 'sky') { anim = null; zoomAt = null; zoomGoal = A.clamp((zoomGoal || S.view.fov) * f, 12, 130); }
    else setSpan(Cosmos.view.goal * f * f * f);
  }
  $('b-in').addEventListener('click', function () { zoom(0.8); });
  $('b-out').addEventListener('click', function () { zoom(1.25); });
  $('m-sky').addEventListener('click', function () { setMode('sky'); });
  $('m-cosmos').addEventListener('click', function () { setMode('cosmos'); });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { closeSheet(); S.sel = null; }
    if (S.mode !== 'sky' || S.sensor) return;
    var st = S.view.fov / 12;
    if (e.key.indexOf('Arrow') === 0) { anim = null; glide = null; }
    if (e.key === 'ArrowLeft') S.view.az = A.norm360(S.view.az - st);
    if (e.key === 'ArrowRight') S.view.az = A.norm360(S.view.az + st);
    if (e.key === 'ArrowUp') S.view.alt = A.clamp(S.view.alt + st, -8, 90);
    if (e.key === 'ArrowDown') S.view.alt = A.clamp(S.view.alt - st, -8, 90);
    if (e.key === '+' || e.key === '=') zoom(0.8); if (e.key === '-') zoom(1.25);
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.live) S.t = Date.now(); last = 0; });

  /* ---------- Bucle principal ---------- */
  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = last ? Math.min(0.25, (now - last) / 1000) : 0; last = now;
    if (S.live && S.rate === 1) S.t = Date.now(); else S.t += dt * 1000 * S.rate;
    if (S.mode === 'sky') {
      if (S.sensor && sens.F) {
        S.cam.F = sens.F; S.cam.U = sens.U; S.cam.R = sens.R;
        var h = A.azAltFromEnu(sens.F); S.view.az = h.az; S.view.alt = h.alt;
      } else { stepAnim(now); stepMotion(dt); camFromView(); }
      Sky.render(ctx, W, H, S, now);
    } else {
      stepSpin(dt);
      Cosmos.render(ctx, W, H, S, dt);
    }
    if (ripples.length) drawRipples(now);
    refreshChips(false); refreshHeading(); refreshBanner();
  }

  /* ---------- Inicio ---------- */
  function welcome() {
    var touch = 'ontouchstart' in window && window.DeviceOrientationEvent && window.isSecureContext !== false;
    $('welcome').innerHTML = '<div class="card"><p class="kick">' + esc(S.site.name) + ' · 30° S</p><h1>' + esc(T('welcomeTitle')) + '</h1><p>' + esc(fmt(T('welcomeBody'), S.site.name)) + '</p>' +
      '<ul><li>' + esc(T('w1')) + '</li><li>' + esc(T('w2')) + '</li><li>' + esc(T('w3')) + '</li></ul>' +
      '<button class="btn gold wide" data-act="start">' + esc(T('start')) + '</button>' +
      (touch ? '<button class="btn wide" data-act="start" data-id="sensor">' + esc(T('startSensor')) + '</button>' : '') + '</div>';
    $('welcome').classList.add('show');
  }
  function init() {
    var seen = store.load();
    $('b-sensor').innerHTML = ICON.compass; $('b-cam').innerHTML = ICON.cam; $('b-in').innerHTML = ICON.plus; $('b-out').innerHTML = ICON.minus;
    $('b-red').innerHTML = ICON.moon;
    $('b-what').innerHTML = ICON.scope + '<span></span>'; $('b-tonight').innerHTML = ICON.list + '<span></span>'; $('b-layers').innerHTML = ICON.layers + '<span></span>';
    document.body.classList.toggle('red', S.red); $('b-red').classList.toggle('on', S.red);
    resize(); window.addEventListener('resize', resize);
    applyLang(); refreshRail(); setMode('sky');
    // Vista inicial: hacia el objeto más llamativo que esté sobre el horizonte
    camFromView(); Sky.update(S);
    var best = null, bs = -1;
    Sky.dsos.forEach(function (o, i) { var h = A.azAltFromEnu(Sky.dirOf({ kind: 'dso', id: i })); if (h.alt > 20 && h.alt < 70 && o.d.prio > bs) { bs = o.d.prio; best = h; } });
    if (best) { S.view.az = best.az; S.view.alt = A.clamp(best.alt, 25, 60); }
    if (!seen) welcome(); else intro();
    if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    requestAnimationFrame(frame);
  }
  window.__cielos = { S: S, Sky: Sky, Cosmos: Cosmos, Astro: A, select: select, identify: identify, setTime: setTime, setMode: setMode, onOrient: onOrient, openTonight: openTonight };
  init();
})();

</script>
</body>
